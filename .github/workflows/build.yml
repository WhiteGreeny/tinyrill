name: Verify candidate
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: ubuntu-24.04, id: linux-amd64, race: true}
          - {runner: windows-2025, id: windows-amd64, race: false}
          - {runner: macos-15, id: macos-native, race: true}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
          cache: true
      - name: Format, vet, tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          if (gofmt -l .) { throw 'gofmt required' }
          go mod verify
          go vet ./...
          go test -count=1 -timeout=120s ./...
      - name: Race detector
        if: matrix.race
        run: go test -race -count=1 -timeout=180s ./...
      - name: Windows credential store integration
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:TINYRILL_TEST_NATIVE_CREDENTIALS = '1'
          go test -count=1 ./internal/credentials -run TestNative
      - name: Isolated Linux credential store integration
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gnome-keyring dbus
          bash scripts/test-linux-keyring.sh
      - name: Generate verified candidate with source, SBOM and scans
        shell: pwsh
        run: ./scripts/release.ps1 -Version "dev-${{ github.sha }}"
      - name: Rootless container smoke test
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y podman
          bash scripts/container-smoke.sh "dev-${{ github.sha }}"
          bash scripts/scan-image.sh "dev-${{ github.sha }}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tinyrill-${{ matrix.id }}-${{ github.sha }}
          path: |
            dist/dev-${{ github.sha }}/*.zip
            dist/dev-${{ github.sha }}/*.tar.gz
            dist/dev-${{ github.sha }}/*.tar
            dist/dev-${{ github.sha }}/*.sha256
            dist/dev-${{ github.sha }}/*.json
          if-no-files-found: error
          retention-days: 14
  linux-arm64:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
      - shell: pwsh
        run: ./scripts/release.ps1 -TargetOS linux -TargetArch arm64 -Version "dev-${{ github.sha }}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tinyrill-linux-arm64-${{ github.sha }}
          path: |
            dist/dev-${{ github.sha }}/*.tar.gz
            dist/dev-${{ github.sha }}/*.sha256
            dist/dev-${{ github.sha }}/*.json
          if-no-files-found: error
          retention-days: 14
